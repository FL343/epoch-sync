name: reconcile
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: ubuntu-24.04
    # a wedged HTTP call must not hold the concurrency group for the 6h default
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Yield gate: while the external monitor reports a fallback actively settling
      # (flag fresh), skip this run so a stale-state run cannot double-settle matches
      # the fallback already handled. Fail-open: monitor unreachable = proceed.
      - name: gate
        id: gate
        env:
          FLAG_URL: ${{ secrets.FLAG_URL }}
        run: |
          y=false
          if [ -n "$FLAG_URL" ]; then
            resp=$(curl -fsS --max-time 5 "$FLAG_URL/flag" 2>/dev/null || true)
            case "$resp" in *'"active":true'*) y=true;; esac
          fi
          # O689: the job's start, for the push backoff in persist (never past the job's limit; tools/state-stash.js backoff)
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          echo "yield=$y" >> "$GITHUB_OUTPUT"
          if [ "$y" = true ]; then echo "fallback active - yielding this run"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.yield != 'true'
        with:
          # the branch tip when the job starts, not the commit the event fired on: a run that waited in the
          # concurrency queue (a native schedule landing next to the dispatcher's run) would otherwise work on the
          # state from before the previous run's push -- re-settling what that run just settled
          ref: ${{ github.ref_name }}
          # full history: the replica push rejects shallow updates
          fetch-depth: 0
      # O463 (2026-10-14): the full suite went from seconds (10-08) to 3+ min (10-13) as audit fixes landed end-to-end
      # tests that run validate.js tens to hundreds of times, while the settlement itself stayed at about a second --
      # most of the 5-min cadence, and at that rate past the 10-min job timeout (= no settlement at all). Same code +
      # same node = same verdict, so a pass is proven once per code change: the key hashes every tracked file except the
      # state files the workflows write back (tools/code-hash.js), a pass is remembered in the Actions cache, and an
      # unchanged tree goes straight to the run. Code that has not passed still never settles (no pass = no cache entry
      # = the tests run; a cache outage only means they run). Retests go 4 at a time. The nightly audit reruns the whole
      # suite on the real date (a test that only breaks on a later day still surfaces, without holding settlement).
      - name: code hash
        id: code
        if: steps.gate.outputs.yield != 'true'
        run: |
          k=$(node tools/code-hash.js) || k=""
          echo "key=tests-pass-${k:-unhashed-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "part=tests-part-${k:-unhashed-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: tests passed before?
        id: passed
        if: steps.gate.outputs.yield != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tests-passed
          key: ${{ steps.code.outputs.key }}
          lookup-only: true
      # Q362 (2026-11-02, second-round audit B2-1 leftover 1): the suite keeps growing and shares this job's 10 minutes
      # with the settlement. Once one full pass outgrew the job, every run would be killed inside the test step, the pass
      # never remembered, the next run starting from the top again = no settlement at all, never recovering by itself.
      # So the files that already passed for this exact code are kept too (.tests-progress, one cache entry per run, the
      # newest restored by prefix; the prefix carries the same code fingerprint, so a code change starts clean) and only
      # the rest run. The step has its own timeout under the job's, and whatever passed is saved even when the step did
      # not finish, so every run moves forward and any suite length converges in a few runs. A run that picks up earlier
      # progress also stops starting new files after 4 min (the rest wait for the next run), which leaves the settlement
      # its time; the first run after a code change (and a run that cannot reach the cache) has no budget and behaves as
      # before. Settlement still needs every file green for this code (the full marker below), as before.
      - name: tests partly passed before?
        id: part
        if: steps.gate.outputs.yield != 'true' && steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tests-progress
          key: ${{ steps.code.outputs.part }}-${{ github.run_id }}
          restore-keys: ${{ steps.code.outputs.part }}-
      - name: test
        id: test
        if: steps.gate.outputs.yield != 'true' && steps.passed.outputs.cache-hit != 'true'
        # under the job's 10 min, so the progress save below always gets to run
        timeout-minutes: 7
        env:
          PART_FROM: ${{ steps.part.outputs.cache-matched-key }}
        run: |
          # Fixture-driven tests deliberately trip the real ::warning:: emitters and the step-summary
          # writer (forgery / seedcap over-cap / signals eviction / page-cap). Stop the runner from
          # scraping that as run annotations + summary: ~20 fixture warnings per run drowned any real
          # production warning. Workflow commands resume after the suite; a failing test still fails.
          unset GITHUB_STEP_SUMMARY
          t="tests-$(date +%s%N)"; echo "::stop-commands::$t"
          budget=""; [ -n "$PART_FROM" ] && budget="--budget-min=4"
          node tools/run-tests.js --jobs=4 $budget --done-file=.tests-progress test/*.js || exit 1
          echo "::$t::"
          date -u +%FT%TZ > .tests-passed
      # Q362: the files that passed this run are kept even when the step did not finish (red file, budget, step timeout)
      - name: remember partial progress
        if: always() && steps.gate.outputs.yield != 'true' && steps.passed.outputs.cache-hit != 'true' && steps.test.outcome != 'success' && steps.test.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tests-progress
          key: ${{ steps.code.outputs.part }}-${{ github.run_id }}-${{ github.run_attempt }}
      # only after a green test step (no status function in the condition = success() implied)
      - name: remember the pass
        if: steps.gate.outputs.yield != 'true' && steps.passed.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tests-passed
          key: ${{ steps.code.outputs.key }}
      # O689: a run whose state push failed kept its state files in the Actions cache (another service than the git push that
      # failed). The newest copy of this channel is applied only when nothing moved the branch's copy of those files since
      # (tools/state-stash.js restore); otherwise the checkout stays as it is = the behaviour before (settle from the branch).
      - name: kept state
        id: kept
        if: steps.gate.outputs.yield != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-stash
          key: state-stash-reconcile-${{ github.run_id }}
          restore-keys: state-stash-reconcile-
      - name: apply kept state
        id: stash
        if: steps.gate.outputs.yield != 'true'
        # a crash of the tool leaves the checkout as checked out: the run goes on as before; only halt=1 (files half replaced
        # and not put back) stops the run step
        continue-on-error: true
        run: node tools/state-stash.js restore reconcile
      - name: run
        id: run
        # R1-B2-03: the step times out before the job does (job: 10 min), so a wedged run still leaves the persist
        # step time to commit the one-shot marks validate.js already saved next to its board writes
        timeout-minutes: 8
        if: steps.gate.outputs.yield != 'true' && steps.stash.outputs.halt != '1'
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          APPID: ${{ secrets.APPID }}
          LB_PREFIX: ${{ secrets.LB_PREFIX }}
          RANKED_LB: ${{ secrets.RANKED_LB }}
          LP_LB: ${{ secrets.LP_LB }}
          XP_LB: ${{ secrets.XP_LB }}
          SUPPORTER_DLC_APPID: ${{ secrets.SUPPORTER_DLC_APPID }}   # supporter pack DLC (no game ids in this repo)
          CLASSIC_APPID: ${{ secrets.CLASSIC_APPID }}   # classic loyalty crate: the older game (classic.js; unset = lane off)
          STATE_SALT: ${{ secrets.STATE_SALT }}
          # O124 seedcap consult (read-only; seedcap.yml owns seedcap.json). Enforce + the bounded reject window armed
          # 2026-10-23 (knife 5.5b-1 S4, user ruling: the main channel takes the playtest / demo stance of 2026-09-18 with
          # three weeks before EA to watch it; a new world core is observation-only for its first 72 h / 200 honest audits).
          SC_STATE_FILE: seedcap.json
          SEEDCAP_ENFORCE: '1'
          SEEDCAP_REJECT: '1'
          # O198 v1 shadow pool: the reject-window bit on trust_tier rows; '0' clears every bit next run (remote off switch)
          SHADOW_POOL: '1'
          # client knife 5.8a: a lone bot record carrying a usable guard match signature block (attest.verifyMatchSig) is credited
          # without the single-writer discount; '0' / unset = the 0.6 lane for every lone bot record, the blocks only counted
          MSIG_BOTS: '1'
          # client knife 5.8b: disputed two-voice 1V1 keys with one usable signed side -- record = counted and logged only (what the
          #   signature would settle); enforce = settled by it (turned on remotely once the data hold, the companion plan section 2.6)
          MSIG_PAIR: record
          # client knife 5c (O606): couch competitive segments (two local seats, one account, guard-signed) settle into the duo
          #   competitive family -- merge = the duo ladder + composite + duo rating (default); split = later couch runs go to the
          #   couch ladder only (forward-only: couch rows already on the duo ladder stay). One line to flip, no client build.
          COUCH_DUO: merge
          # O198 v1 trust ledger (knife 5.5b-1): this job writes trust.json; the sanctions twin's file is a read-only
          # consult (its event queue), like seedcap.json above
          TRUST_FILE: trust.json
          SN_STATE_FILE: sanctions.json
          # all boards are provisioned: a board missing from the listing is a config
          # regression -- fail loudly (e-mail) instead of silently skipping authority
          STRICT_BOARDS: '1'
          # campaign endless (Gold Rush) mass-anomaly mail (same inbox as the seedcap alert; unset = warning only)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FB_DIGEST_TO: ${{ secrets.FB_DIGEST_TO }}
          # O777 (2026-11-09, user ruling under architecture decision 10): the full game's launch week (EA 2026-11-17). Until
          # this instant a leave is recorded (leavers.json, marked as a window leave) but does not discount XP, quick and ranked
          # alike, and the leaves marked in it stay uncounted afterwards; a ranked leave is fined LEAVER_LP_EASY instead of 100
          # (validate.js leaverXpRecordOnlyUntil / leaverLpFineOf: strict ISO-8601 UTC, at most 31 days ahead, main channel
          # only for the fine). After it both come back by themselves -- these lines need no removal. test/channel-workflows.js
          # allows these keys here (and the XP one on the demo twin) and nowhere else.
          LEAVER_XP_RECORD_ONLY_UNTIL: '2026-11-24T12:26:00Z'
          LEAVER_LP_EASY: '50'
          LEAVER_LP_EASY_UNTIL: '2026-11-24T12:26:00Z'
        run: node validate.js
      - name: persist
        id: persist
        # R1-B2-03: also after a FAILED run. validate.js writes some boards long before its normal state save
        # (consolation XP, confession points) and the whole main path before the trust / redeem upkeep that can
        # still exit 1; the markers that make those writes one-shot are already on disk (written atomically) --
        # dropping them made the next run pay / fine / settle the same matches again. Not after a skipped run
        # (yield gate, red tests): nothing ran, nothing to save.
        if: always() && steps.gate.outputs.yield != 'true' && steps.run.outcome != 'skipped'
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          # = the job's timeout-minutes (test/state-stash-wiring.js): the backoff ends RESERVE_S before it
          JOB_LIMIT_S: '600'
        run: |
          state_files=""
          for f in processed.json skill.json leavers.json xp.json starts.json signals.json groups.json confessions.json unmatched.json supporters.json classic.json endless-solo.json campaign-endless.json rfduo.json chat-mute.json pending-writes.json trust.json likes.json err-reports.json; do
            [ -f "$f" ] && state_files="$state_files $f"
          done
          printf '%s\n' $state_files > "$RUNNER_TEMP/state-files"
          if [ -n "$state_files" ] && [ -n "$(git status --porcelain -- $state_files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $state_files
            git commit -m "state: update reconciliation state$([ "$RUN_OUTCOME" = success ] || echo " (run $RUN_OUTCOME: marks saved before the exit)")"
            # Any other push landing between the rebase and the push (a code push, or a sibling
            # channel's state commit: the dispatcher fires every workflow in the same second) rejects
            # this push; losing the state commit means the next run re-settles the same matches =
            # double-applied LP/XP/CP (the boards are already written). Rebase (state files are
            # bot-only, trivially clean) and retry like every sibling persist step; fail LOUDLY if it
            # still cannot land. test/workflow-push-retry.js pins this shape for every workflow.
            n=0
            until git pull --rebase origin "${GITHUB_REF_NAME}" && git push; do
              n=$((n+1))
              if [ "$n" -ge 4 ]; then echo "::error::state push failed after $n tries -- the files are kept in the Actions cache for the next run (O689 keep state); if that copy cannot be used there, the next run re-settles this batch"; exit 1; fi
              # O689: 15 / 45 / 90 s (GitHub's 500s on push mostly clear in tens of seconds), cut to the job's end
              sleep "$(node tools/state-stash.js backoff "$n" || echo 5)"
            done
          else
            echo "no state change"
          fi
      # O689: persist failed -> keep the files it could not push for the next run; pushed after a kept copy was used -> cache
      # the cleared marker on top of it (the newest entry wins the next restore). Best effort: losing the copy = the behaviour before.
      - name: keep state
        id: keep
        if: always() && (steps.persist.outcome == 'failure' || steps.persist.outcome == 'success')
        continue-on-error: true
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          STASH_FOUND: ${{ steps.stash.outputs.found }}
        run: node tools/state-stash.js out reconcile "$PERSIST_OUTCOME" "$STASH_FOUND" $(cat "$RUNNER_TEMP/state-files" 2>/dev/null)
      - name: cache kept state
        if: always() && steps.keep.outputs.write == '1'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-stash
          key: state-stash-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
      - name: heartbeat
        if: steps.gate.outputs.yield != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          if [ "$age" -ge 14 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .heartbeat
            git add .heartbeat
            git commit -m "chore: heartbeat"
            n=0
            until git pull --rebase origin "${GITHUB_REF_NAME}" && git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "::error::heartbeat push failed after $n tries"; exit 1; fi
              sleep $((5 * n))
            done
          else
            echo "heartbeat not due (age ${age}d)"
          fi
      # Offsite state replica: push the exact post-persist HEAD to a write-enabled
      # replica so a disaster-recovery pipeline always has state <=1 run stale.
      # Best-effort: a replica outage must not fail production runs; sustained drift
      # is caught by the replica side's weekly freshness check.
      - name: replicate
        # after every persist that landed, failed runs included (R1-B2-03): the fallback must not settle from state
        # missing a failed run's one-shot marks
        if: always() && steps.gate.outputs.yield != 'true' && steps.persist.outcome == 'success'
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
        run: |
          if [ -z "$MIRROR_URL" ]; then echo "replica not configured - skip"; exit 0; fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > "$HOME/.ssh/replica_known_hosts"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$HOME/.ssh/replica_key"
          chmod 600 "$HOME/.ssh/replica_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/replica_key -o UserKnownHostsFile=$HOME/.ssh/replica_known_hosts -o IdentitiesOnly=yes"
          git push --force --quiet "$MIRROR_URL" HEAD:main \
            && echo "replica updated" \
            || echo "::warning::replica push failed (replica stale; weekly drift check will flag if sustained)"
      # O393 tier 3 (2026-10-25): push the exact post-persist tree (code + state) to the Cloud Run failover service, so a fallback that
      # finds github AND gitlab unreachable starts from state <=1 run stale (bucket state/main/latest.tar.gz) instead of an older snapshot.
      # Best-effort like replicate: a failure only warns. The request is signed the same way the monitor signs it (ts / nonce / HMAC-SHA256
      # over "ts\nnonce\nPOST /state-push"); the secret never leaves this step. Skipped when VAULT_URL / VAULT_HMAC are unset.
      - name: vault-state
        if: always() && steps.gate.outputs.yield != 'true' && steps.persist.outcome == 'success'
        env:
          VAULT_URL: ${{ secrets.VAULT_URL }}
          VAULT_HMAC: ${{ secrets.VAULT_HMAC }}
        run: |
          if [ -z "$VAULT_URL" ] || [ -z "$VAULT_HMAC" ]; then echo "vault state push not configured - skip"; exit 0; fi
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/state-tree.tgz"
          ts=$(date +%s%3N); nonce=$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')
          sig=$(printf '%s\n%s\nPOST /state-push' "$ts" "$nonce" | openssl dgst -sha256 -hmac "$VAULT_HMAC" -r | cut -d' ' -f1)
          curl -fsS --max-time 90 -X POST "${VAULT_URL%/}/state-push" -H "x-gmt-ts: $ts" -H "x-gmt-nonce: $nonce" -H "x-gmt-sig: $sig" \
            -H "x-gmt-sha: $(git rev-parse HEAD)" -H "x-gmt-run: $GITHUB_RUN_ID" -H "content-type: application/gzip" \
            --data-binary "@$RUNNER_TEMP/state-tree.tgz" -o /dev/null \
            && echo "vault state pushed ($(stat -c %s "$RUNNER_TEMP/state-tree.tgz") bytes)" \
            || echo "::warning::vault state push failed (tier-3 fallback would start from an older state; mvp/KNIFE_O393_FAILOVER_VAULT_PLAN.md)"
