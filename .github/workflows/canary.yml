name: canary
# Dead-man switch: the reconcile workflow is fired by an EXTERNAL 5-minute timer, so if that timer
# (or its token) dies there are no runs at all -- no failures, no failure e-mails, pure silence.
# This schedule runs on GitHub's own cron (independent of the external timer) and FAILS when the
# last successful reconcile is older than the freshness threshold; a failed run triggers GitHub's
# built-in workflow-failure e-mail to the repo owner. GitHub throttles schedules on low-activity
# repos to a few firings per day -- fine for a canary (detection within hours, not minutes).
# Manual drill: dispatch with max_age=1 to force a failure and verify the e-mail actually arrives.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      max_age:
        description: 'freshness threshold in seconds (default 10800 = 3h)'
        required: false
        default: '10800'
permissions:
  actions: read
jobs:
  canary:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE: ${{ inputs.max_age || '10800' }}
        run: |
          # The status-filtered run listing (--status success) is served from a lagging index: it
          # intermittently returned a success from days earlier while reconcile was green every five
          # minutes (9 false alarms 2026-09-18..10-01). List recent runs unfiltered and pick the newest
          # success client-side, and only alarm when three reads a minute apart all agree it is stale.
          for attempt in 1 2 3; do
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reconcile --limit 40 --json conclusion,updatedAt --jq '[.[] | select(.conclusion == "success")][0].updatedAt // empty')
            if [ -n "$last" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              echo "read $attempt: last successful reconcile $last (${age}s ago, threshold ${MAX_AGE}s)"
              if [ "$age" -le "$MAX_AGE" ]; then exit 0; fi
            else
              echo "read $attempt: no success among the 40 most recent reconcile runs"
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          echo "::error::reconcile has no success within ${MAX_AGE}s on three reads -- external dispatch timer, its token, or the workflow itself is dead"
          exit 1
