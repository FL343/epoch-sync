name: demo
# Third-appid reconcile job for the public demo channel (validate.js PT_MODE=1 -- the same
# restricted pre-release channel semantics as the playtest job: no rating/points/redeem surface,
# quick + co-op endless + friend-room XP settle only, channel boards provisioned idempotently,
# forbidden boards hard-fail the run). Own workflow + disjoint demo-*.json state files so the
# bot pushes of every channel rebase cleanly past each other; offset schedule (minute 1 of each 5)
# keeps the runners off the same tick boundary (reconcile=0, demo=1, feedback=2, playtest=3,
# sanctions=4). The client caps demo progress (depth / level) on its own side; the reconcile
# stays same-source -- authoritative values are still what the client reads back and corrects to.
# No fallback yield gate: the disaster-recovery fallback only settles the MAIN app, so this job
# can never double-settle anything the fallback handled.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '1-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: demo
  cancel-in-progress: false
jobs:
  demo:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch tip when the job starts, not the commit the event fired on: a run that waited in the
          # concurrency queue (a native schedule landing next to the dispatcher's run) would otherwise work on the
          # state from before the previous run's push -- re-settling what that run just settled
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: test
        run: |
          # Fixture-driven tests deliberately trip the real ::warning:: emitters and the step-summary
          # writer (forgery / seedcap over-cap / signals eviction / page-cap). Stop the runner from
          # scraping that as run annotations + summary: ~20 fixture warnings per run drowned any real
          # production warning. Workflow commands resume after the loop; a failing test still fails.
          unset GITHUB_STEP_SUMMARY
          t="tests-$(date +%s%N)"; echo "::stop-commands::$t"
          for f in test/playtest-*.js test/channel-*.js; do echo "== $f =="; node "$f" || exit 1; done
          echo "::$t::"
      - name: run
        id: run
        # R1-B2-03: the step times out before the job does (job: 10 min), so a wedged run still leaves the persist
        # step time to commit the one-shot marks validate.js already saved next to its board writes
        timeout-minutes: 8
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          APPID: ${{ secrets.DEMO_APPID }}
          # O156 (client knife 3.7c): the demo job identifies itself by APPID == DEMO_APPID -> lone bot
          # records settle there only (a single human vs bots has no second writer); playtest keeps them lone.
          DEMO_APPID: ${{ secrets.DEMO_APPID }}
          LB_PREFIX: ${{ secrets.LB_PREFIX }}
          XP_LB: ${{ secrets.XP_LB }}
          # rating/points board names are consulted ONLY by the forbidden-board tripwire here
          RANKED_LB: ${{ secrets.RANKED_LB }}
          LP_LB: ${{ secrets.LP_LB }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
          PT_MODE: '1'
          PROCESSED_FILE: demo-processed.json
          LEAVERS_FILE: demo-leavers.json
          XP_FILE: demo-xp.json
          STARTS_FILE: demo-starts.json
          SIGNALS_FILE: demo-signals.json
          CONFESSIONS_FILE: demo-confessions.json
          UNMATCHED_FILE: demo-unmatched.json
          SOLO_FILE: demo-endless-solo.json
          CHAT_MUTE_FILE: demo-chat-mute.json
          LIKES_FILE: demo-likes.json
          SUPPORTERS_FILE: demo-supporters.json
          PENDING_WRITES_FILE: demo-pending-writes.json
          # O124 seedcap consult (read-only; seedcap.yml's demo twin owns the file). Enforce on
          # from day one: the demo inherits the playtest enforce soak (0 over-cap, 0 suspects);
          # SEEDCAP_REJECT armed 2026-09-18 together with playtest (twin env): the bounded
          # 24h/3d/7d/14d per-account window, never permanent; veto alone already blocks over-cap.
          SC_STATE_FILE: demo-seedcap.json
          SEEDCAP_ENFORCE: '1'
          SEEDCAP_REJECT: '1'
          # O198 v1 shadow pool: the reject-window bit on trust_tier rows; '0' clears every bit next run (remote off switch)
          SHADOW_POOL: '1'
          # client knife 5.8a: a lone bot record carrying a usable guard match signature block (attest.verifyMatchSig) is credited
          # without the single-writer discount; '0' / unset = the 0.6 lane for every lone bot record, the blocks only counted
          MSIG_BOTS: '1'
          # client knife 5.8b: disputed two-voice 1V1 keys with one usable signed side -- record = counted and logged only (what the
          #   signature would settle); enforce = settled by it (turned on remotely once the data hold, the companion plan section 2.6)
          MSIG_PAIR: record
          # O198 v1 trust ledger (knife 5.5b-1): this job writes the channel's trust file; the sanctions twin's file is a
          # read-only consult (its event queue), like the seedcap file above
          TRUST_FILE: demo-trust.json
          SN_STATE_FILE: demo-sanctions.json
          # rating-side state is never produced in PT mode; pointed off the main files anyway
          # (belt over suspenders) and deliberately NOT persisted below.
          SKILL_FILE: demo-skill.json
          GROUPS_FILE: demo-groups.json
          STRICT_BOARDS: '1'
          # M194 / W57 (2026-10-15, user ruling under architecture decision 10): through the Steam Next Fest a demo
          # leave is recorded (demo-leavers.json exactly as before) but does not discount demo XP until this instant
          # (validate.js leaverXpRecordOnlyUntil: demo channel only, strict ISO-8601 UTC, at most 31 days ahead). After
          # it the discount comes back by itself -- this line needs no removal. Demo only: test/channel-workflows.js
          # allows this one key on the demo twin and nowhere else.
          LEAVER_XP_RECORD_ONLY_UNTIL: '2026-10-27T00:00:00Z'
        run: node validate.js
      - name: persist
        id: persist
        # R1-B2-03: also after a FAILED run. validate.js writes some boards long before its normal state save
        # (consolation XP, confession points) and the whole main path before the trust / redeem upkeep that can
        # still exit 1; the markers that make those writes one-shot are already on disk (written atomically) --
        # dropping them made the next run pay / fine / settle the same matches again. Not after a skipped run
        # (yield gate, red tests): nothing ran, nothing to save.
        if: always() && steps.run.outcome != 'skipped'
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          state_files=""
          for f in demo-processed.json demo-leavers.json demo-xp.json demo-starts.json demo-signals.json demo-confessions.json demo-unmatched.json demo-supporters.json demo-endless-solo.json demo-chat-mute.json demo-pending-writes.json demo-trust.json demo-likes.json; do
            [ -f "$f" ] && state_files="$state_files $f"
          done
          if [ -n "$state_files" ] && [ -n "$(git status --porcelain -- $state_files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $state_files
            git commit -m "state: update demo reconciliation state$([ "$RUN_OUTCOME" = success ] || echo " (run $RUN_OUTCOME: marks saved before the exit)")"
            n=0
            until git pull --rebase origin "${GITHUB_REF_NAME}" && git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "::error::demo state push failed after $n tries"; exit 1; fi
              sleep $((5 * n))
            done
          else
            echo "no state change"
          fi
