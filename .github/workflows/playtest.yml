name: playtest
# Second-appid reconcile job for the pre-release playtest channel (validate.js PT_MODE=1).
# Own workflow + disjoint pt-*.json state files (feedback.yml precedent): the bot pushes of
# the three workflows always rebase cleanly past each other, and the offset schedule keeps
# the runners off the same tick boundary (reconcile=0, feedback=2, playtest=3 of each 5).
# The playtest channel keeps NO rating/points/redeem surface: PT_MODE skips those wholesale,
# provisions the channel's own boards idempotently, and hard-fails the run if a forbidden
# board ever appears on the app (lock layer 3 -- the surface must not exist).
# No fallback yield gate: the disaster-recovery fallback only settles the MAIN app, so this
# job can never double-settle anything the fallback handled.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: playtest
  cancel-in-progress: false
jobs:
  playtest:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch tip when the job starts, not the commit the event fired on: a run that waited in the
          # concurrency queue (a native schedule landing next to the dispatcher's run) would otherwise work on the
          # state from before the previous run's push -- re-settling what that run just settled
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: test
        run: |
          # Fixture-driven tests deliberately trip the real ::warning:: emitters and the step-summary
          # writer (forgery / seedcap over-cap / signals eviction / page-cap). Stop the runner from
          # scraping that as run annotations + summary: ~20 fixture warnings per run drowned any real
          # production warning. Workflow commands resume after the loop; a failing test still fails.
          unset GITHUB_STEP_SUMMARY
          t="tests-$(date +%s%N)"; echo "::stop-commands::$t"
          for f in test/playtest-*.js; do echo "== $f =="; node "$f" || exit 1; done
          echo "::$t::"
      - name: run
        id: run
        # R1-B2-03: the step times out before the job does (job: 10 min), so a wedged run still leaves the persist
        # step time to commit the one-shot marks validate.js already saved next to its board writes
        timeout-minutes: 8
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          APPID: ${{ secrets.PLAYTEST_APPID }}
          # O156 (client knife 3.7c): the demo job identifies itself by APPID == DEMO_APPID -> lone bot
          # records settle there only (a single human vs bots has no second writer); playtest keeps them lone.
          DEMO_APPID: ${{ secrets.DEMO_APPID }}
          LB_PREFIX: ${{ secrets.LB_PREFIX }}
          XP_LB: ${{ secrets.XP_LB }}
          # rating/points board names are consulted ONLY by the forbidden-board tripwire here
          RANKED_LB: ${{ secrets.RANKED_LB }}
          LP_LB: ${{ secrets.LP_LB }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
          PT_MODE: '1'
          PROCESSED_FILE: pt-processed.json
          LEAVERS_FILE: pt-leavers.json
          XP_FILE: pt-xp.json
          STARTS_FILE: pt-starts.json
          SIGNALS_FILE: pt-signals.json
          CONFESSIONS_FILE: pt-confessions.json
          UNMATCHED_FILE: pt-unmatched.json
          SOLO_FILE: pt-endless-solo.json
          CHAT_MUTE_FILE: pt-chat-mute.json
          SUPPORTERS_FILE: pt-supporters.json
          # O124 seedcap consult (read-only; seedcap.yml owns the file). ENFORCE armed
          # 2026-09-01 after a clean 80-match observation soak (0 over-cap, 0 suspects).
          # SEEDCAP_REJECT armed 2026-09-18 after the 2-week enforce soak (173 audited groups:
          # 0 over-cap, 0 veto, 0 suspects; the anomaly-alert mail never fired). The lever is a bounded
          # WINDOW (24h / 3d / 7d / 14d cap by conviction count, validate.js ladder) that
          # discards only the flagged account's own settlement and clears on its own --
          # never a permanent lock. veto alone already blocks every over-cap match and
          # self-heals if the auditor clears a flag.
          SC_STATE_FILE: pt-seedcap.json
          SEEDCAP_ENFORCE: '1'
          SEEDCAP_REJECT: '1'
          # rating-side state is never produced in PT mode; pointed off the main files anyway
          # (belt over suspenders) and deliberately NOT persisted below.
          SKILL_FILE: pt-skill.json
          GROUPS_FILE: pt-groups.json
          STRICT_BOARDS: '1'
        run: node validate.js
      - name: persist
        id: persist
        # R1-B2-03: also after a FAILED run. validate.js writes some boards long before its normal state save
        # (consolation XP, confession points) and the whole main path before the trust / redeem upkeep that can
        # still exit 1; the markers that make those writes one-shot are already on disk (written atomically) --
        # dropping them made the next run pay / fine / settle the same matches again. Not after a skipped run
        # (yield gate, red tests): nothing ran, nothing to save.
        if: always() && steps.run.outcome != 'skipped'
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          state_files=""
          for f in pt-processed.json pt-leavers.json pt-xp.json pt-starts.json pt-signals.json pt-confessions.json pt-unmatched.json pt-supporters.json pt-endless-solo.json pt-chat-mute.json; do
            [ -f "$f" ] && state_files="$state_files $f"
          done
          if [ -n "$state_files" ] && [ -n "$(git status --porcelain -- $state_files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $state_files
            git commit -m "state: update playtest reconciliation state$([ "$RUN_OUTCOME" = success ] || echo " (run $RUN_OUTCOME: marks saved before the exit)")"
            n=0
            until git pull --rebase origin "${GITHUB_REF_NAME}" && git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "::error::playtest state push failed after $n tries"; exit 1; fi
              sleep $((5 * n))
            done
          else
            echo "no state change"
          fi
