name: seedcap
# Per-seed score-cap audit (O124). Post-hoc auditor OUTSIDE the reconcile tick
# (feedback.yml precedent: own workflow, disjoint state file, offset schedule).
# Replays every settled/pending match's SEED through a compiled world-model CLI
# and flags scores that exceed the mathematical per-seed cap; the reconcile
# consumes the state read-only on its own tick (veto / suspects / corrections),
# gated by SEEDCAP_ENFORCE there -- this job never writes a game board.
# WINDOWS runner: the CLI is an MSVC /fp:precise build (bit-exact with the JS
# engine's arithmetic); it is fetched from a private artifact repo via a
# read-only deploy key -- generation logic and data tables never appear in this
# public repo in source form, only compiled bytes reach the runner.
# 10-minute cadence (audit is post-hoc; halves the Steam Web API read volume vs
# the 5-minute reconcile tick), driven by the sync-tick CF worker like every
# other tick-class workflow here (native schedules throttle on quiet repos).
# Channels: ea only. The playtest (5049450) and demo (5049460) twin jobs were retired on 2026-11-20 (cloud audit R3,
# M772 item 6): the playtest app closed for good on 10-23 (pt_master off), the demo app was disabled in Steamworks on
# 11-16 (O860) and both reconcile workflows (playtest.yml / demo.yml) are disabled on GitHub, so no client can start a
# match there -- yet the twins kept fetching the full repo every 10 minutes and committing pt-seedcap.json /
# demo-seedcap.json. Both files stay in the repo as the frozen final record (playtest.yml / demo.yml still name them,
# read-only; tools/code-hash.js counts them as hand-kept config now that nothing writes them). Bringing a twin back
# (git history: the commit that retired them) also means moving its file back to state in tools/code-hash.js and
# widening the one-job pins in test/ (seedcap-audit, seedcap-cores, channel-workflows, channel-perk-rules,
# playtest-key-policy, trust-ledger, workflow-push-retry, code-hash).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '4-59/10 * * * *'
permissions:
  contents: read
concurrency:
  group: seedcap
  cancel-in-progress: false
jobs:
  seedcap:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the branch tip when the job starts, not the commit the event fired on: a run that waited in the
          # concurrency queue (a native schedule landing next to the dispatcher's run) would otherwise work on the
          # state from before the previous run's push -- re-settling what that run just settled
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FL343/gmt-authority-dist
          ssh-key: ${{ secrets.SEEDCAP_DIST_KEY }}
          path: authority-dist
      - name: test
        shell: bash
        run: |
          # Fixture-driven tests deliberately trip the real ::warning:: emitters and the step-summary
          # writer (forgery / seedcap over-cap / signals eviction / page-cap). Stop the runner from
          # scraping that as run annotations + summary: ~20 fixture warnings per run drowned any real
          # production warning. Workflow commands resume after the loop; a failing test still fails.
          unset GITHUB_STEP_SUMMARY
          t="tests-$(date +%s%N)"; echo "::stop-commands::$t"
          for f in test/seedcap-*.js; do echo "== $f =="; node "$f" || exit 1; done
          echo "::$t::"
      - name: run
        shell: bash
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          APPID: ${{ secrets.APPID }}
          LB_PREFIX: ${{ secrets.LB_PREFIX }}
          RANKED_LB: ${{ secrets.RANKED_LB }}
          LP_LB: ${{ secrets.LP_LB }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
          SEEDCAP_CLI: ./authority-dist/seedcap_cli.exe
          # versioned world cores: cores/<id>/ + live.json per-channel package windows (root CLI = fallback)
          SEEDCAP_DIST_DIR: ./authority-dist
          SEEDCAP_CHANNEL: ea
          MSIG_PAIR: record   # client knife 5.8b: enforce audits a disputed 1V1 on its signed side (validate.js signedPairOf); record = unchanged
          SC_STATE_FILE: seedcap.json
          PROCESSED_FILE: processed.json
          SIGNALS_FILE: signals.json
          # O198 v1 (knife 5.5b-1): the reconcile's trust ledger of this channel, read-only -- its cursor prunes the event queue
          TRUST_FILE: trust.json
          # offense-board mirror + mass-anomaly alert mail (Resend, feedback.yml channel)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FB_DIGEST_TO: ${{ secrets.FB_DIGEST_TO }}
        run: node seedcap.js
      - name: persist
        shell: bash
        run: |
          if [ -f seedcap.json ] && [ -n "$(git status --porcelain -- seedcap.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- seedcap.json
            git commit -m "state: update seedcap audit state"
            n=0
            until git pull --rebase origin "${GITHUB_REF_NAME}" && git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "::error::seedcap state push failed after $n tries"; exit 1; fi
              sleep $((5 * n))
            done
          else
            echo "no state change"
          fi
