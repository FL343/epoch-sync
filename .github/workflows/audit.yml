name: audit
# Nightly read-only invariant audit: board inventory, foreign-writer probe on the
# trusted-writes boards (the practical permission-regression check -- the Web API cannot
# read a board's write configuration, but a misconfig manifests as entries outside the
# cron's own state closure), shard/report hygiene, scale telemetry. Any violation fails
# the run -> GitHub's built-in failure e-mail. GitHub throttles schedules on low-activity
# repos to a few firings a day; for a daily audit that jitter is irrelevant.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'FL343/epoch-sync'
    runs-on: ubuntu-24.04
    # 15 for the audit + the real-clock suite (they take 4-6 min), plus 60 for the time-bomb step below: its own limit is 60,
    # and a job timeout cancels the whole job (continue-on-error does not cover that)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: audit
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          APPID: ${{ secrets.APPID }}
          LB_PREFIX: ${{ secrets.LB_PREFIX }}
          RANKED_LB: ${{ secrets.RANKED_LB }}
          LP_LB: ${{ secrets.LP_LB }}
          XP_LB: ${{ secrets.XP_LB }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
        run: node audit.js
      # O463: the reconcile now runs the suite only when the code changes (a pass is cached per code hash), so a test
      # that breaks only from some date on (a season start, a year boundary) no longer surfaces on that day there. Rerun
      # the whole suite here every night on the real clock: red = fix the test or the code; settlement is not held.
      - name: test
        if: always()
        run: |
          # same annotation hygiene as the reconcile test step (fixtures trip the real ::warning:: emitters)
          unset GITHUB_STEP_SUMMARY
          t="tests-$(date +%s%N)"; echo "::stop-commands::$t"
          node tools/run-tests.js --jobs=4 test/*.js || exit 1
          echo "::$t::"
      # W117 (2026-10-29): run the whole test suite with the clock moved forward (+3 / +14 / +35 days) and list the tests that
      #   pass today but fail on a later date (a date written into a test, e.g. a pacing table that ends on 12-01).
      #   Report only: continue-on-error, and time-bomb.js itself exits 0 once it has run. The last line of this step's log,
      #   "[time-bomb] {json}", is read back by the maintainer's session-start CI check.
      - name: time-bomb (clock moved forward, report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        run: node tools/time-bomb.js --suites test --jobs 4 --days 3,14,35 --label epoch-sync --sha "$GITHUB_SHA"
